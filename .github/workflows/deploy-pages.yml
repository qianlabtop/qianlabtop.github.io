name: Build and deploy lab website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public static files
        run: |
          mkdir -p _site/assets
          cp index.html pi.html pi-en.html platforms.html publications.html members.html contact.html styles.css script.js .nojekyll _site/
          cp assets/pi-qian-binzhi.webp assets/platform-instruments.webp _site/assets/
          cp -R assets/members _site/assets/members
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
